name: Build CatPlayer IPA
on:
  push:
    paths:
      - 'catplayer/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version; xcode-select -p
      - name: Build unsigned
        run: |
          xcodebuild -project catplayer/CatPlayer.xcodeproj -scheme CatPlayer -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CatPlayer.app Payload/
          zip -r CatPlayer-unsigned.ipa Payload
          ls -lh CatPlayer-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CatPlayer-unsigned
          path: CatPlayer-unsigned.ipa
